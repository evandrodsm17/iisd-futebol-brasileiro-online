<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escalações — Campo Longo</title><link rel="stylesheet" href="./editor.css"><style>.columns{display:grid;grid-template-columns:260px 1fr;gap:16px}.panel{padding:15px;background:#102b29;border:1px solid #31534f;border-radius:12px}.teamlist{max-height:60vh;overflow:auto;display:grid;gap:5px}.teamlist button{text-align:left}.roster-row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #426054}.roster-row label{flex:1}.roster-row select{max-width:240px}.roster-row input{width:20px}.pitch{background:#225b38;border:2px solid #a7cb9b;padding:12px;min-height:230px}.pitch-row{display:flex;justify-content:space-around;margin:18px 0}.pitch-player{font-size:11px;max-width:95px;text-align:center;background:#103e38;padding:7px;border-radius:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.teamlist button.selected{background:#3d816e}@media(max-width:740px){.columns{grid-template-columns:1fr}.teamlist{max-height:180px}}</style></head><body><main class="shell"><header><div><p class="eyebrow">CENTRAL DE ELENCOS</p><h1>Escalações e transferências</h1><p>Organize os titulares, reservas e a formação. Transferências preservam a identidade do atleta.</p></div><a href="./index.html">← Editor</a></header><div class="columns"><aside class="panel"><h2>Clubes</h2><div id="teams" class="teamlist"></div></aside><section class="panel"><h2 id="team-title"></h2><label>Formação <select id="formation"></select></label><p>Marque os titulares (até 11) na ordem desejada, incluindo o goleiro como primeiro.</p><div id="roster"></div><div class="toolbar"><button id="save">Salvar escalação</button><button id="reset">Restaurar escalação</button></div><h3>Prévia tática</h3><div id="pitch" class="pitch"></div><p id="status" role="status" aria-live="polite"></p></section></div></main><script type="module" src="./lineups.js"></script></body></html>
