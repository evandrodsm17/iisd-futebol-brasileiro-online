<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar equipes e atletas — ISSD</title><link rel="stylesheet" href="./editor.css"><style>.layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:#102b29;border:1px solid #31534f;border-radius:12px;padding:16px}.list{max-height:62vh;overflow:auto;display:grid;gap:5px}.list button{text-align:left}.list button.selected{background:#3d816e}.muted{color:#b6c9bf;font-size:13px}.player-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px;border-bottom:1px solid #416057}.player-row input{max-width:250px}.player-row span{min-width:70px}.team-edit{display:flex;gap:10px;align-items:end}.team-edit label{flex:1}@media(max-width:720px){.layout{grid-template-columns:1fr}.list{max-height:180px}.player-row{flex-wrap:wrap}} .player-edit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:14px 0;border-bottom:1px solid #416057}.player-edit strong,.player-edit details,.player-buttons{grid-column:1/-1}.player-edit details{border:1px solid #476f63;padding:10px;border-radius:8px}.player-edit details label{display:inline-grid;margin:7px;min-width:130px}.player-buttons{display:flex;gap:8px}.player-edit input,.player-edit select{width:100%}@media(max-width:720px){.player-edit{grid-template-columns:1fr 1fr}}</style></head><body><main class="shell"><header><div><p class="eyebrow">CATÁLOGO DO JOGO</p><h1>Editar equipes e jogadores</h1><p>Edite nome, camisa, posição, atributos e transfira jogadores sem modificar a ROM.</p></div><a href="./index.html">← Editor principal</a></header><p class="muted">As mudanças ficam neste navegador e aparecem na próxima carga da partida. Nenhuma ROM será alterada.</p><div class="toolbar"><button id="export" type="button">Exportar alterações JSON</button><label class="file">Importar alterações JSON<input id="import" type="file" accept=".json,application/json"></label><button id="reset" type="button">Restaurar todas as edições</button></div><div class="layout"><section class="panel"><h2>Equipes da ROM</h2><input id="search" placeholder="Procurar equipe" aria-label="Procurar equipe"><div id="teams" class="list"></div></section><section class="panel"><h2 id="title">Selecione uma equipe</h2><form id="edit-team" class="team-edit"><label>Nome da equipe<input id="team-name" required maxlength="90"></label><button type="submit">Salvar equipe</button><button id="revert-team" type="button">Original</button></form><h3>Jogadores</h3><div id="players"></div></section></div><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="./rom-editor.js"></script></body></html>
